spring.application.name=dealnest

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/dealnestdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Run data.sql on startup (safe: all inserts use ON CONFLICT DO NOTHING)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

cors.allowed.origin=http://localhost:5173

# JWT Configuration — replace JWT_SECRET env var in production
jwt.secret=${JWT_SECRET:dealnest-super-secret-key-change-this-before-production-deploy-256bit}
jwt.expiration.user=86400000
jwt.expiration.admin=28800000
