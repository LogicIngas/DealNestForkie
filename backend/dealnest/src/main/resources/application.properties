spring.application.name=dealnest

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/dealnestdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase pooler caps clients at pool_size (15). Keep the Hikari pool small so
# overlapping deploys (old instance + new instance) and local dev can't exhaust it.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
# Off by default: this prints every statement AND its bound values, so in
# production it writes request data into the log stream. Opt in with
# SHOW_SQL=true when you actually need to read the SQL.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Run schema.sql (idempotent column fixes) then data.sql on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

cors.allowed.origin=http://localhost:5173

# JWT Configuration — replace JWT_SECRET env var in production
jwt.secret=${JWT_SECRET:dealnest-super-secret-key-change-this-before-production-deploy-256bit}
jwt.expiration.user=86400000
jwt.expiration.admin=28800000

# PayFast (South African gateway) — sandbox credentials from https://sandbox.payfast.co.za
# Leave merchant-id blank locally and the checkout returns a clear "not configured" error.
# Amounts are in ZAR (decimal, e.g. 49.00).
payfast.merchant-id=${PAYFAST_MERCHANT_ID:}
payfast.merchant-key=${PAYFAST_MERCHANT_KEY:}
payfast.passphrase=${PAYFAST_PASSPHRASE:}
payfast.sandbox=${PAYFAST_SANDBOX:true}
payfast.plus-amount=${PAYFAST_PLUS_AMOUNT:49.00}
payfast.pro-amount=${PAYFAST_PRO_AMOUNT:199.00}
# Where PayFast redirects/notifies. notify-url must be publicly reachable over https.
payfast.return-url=${PAYFAST_RETURN_URL:https://react-frontend-eplq.onrender.com/profile?payfast=success}
payfast.cancel-url=${PAYFAST_CANCEL_URL:https://react-frontend-eplq.onrender.com/profile?payfast=cancelled}
payfast.notify-url=${PAYFAST_NOTIFY_URL:https://java-backend-05j0.onrender.com/api/payfast/itn}

notifications.voucher-claims.enabled=${VOUCHER_NOTIFICATIONS_ENABLED:true}
# Voucher emails are only ever sent when the user presses "Send to email", never
# automatically on claim. This is how long a single code must wait between sends, which
# keeps a user who spams the button from burning through the provider's daily quota.
# Set to 0 to allow unlimited re-sends.
notifications.voucher-email.cooldown-minutes=${VOUCHER_EMAIL_COOLDOWN_MINUTES:60}
# Email provider: "brevo" (default, no domain of your own required) or "resend" (needs a verified domain).
notifications.email.provider=${NOTIFICATIONS_EMAIL_PROVIDER:brevo}
# Brevo: free tier sends 300 emails/day to any recipient. Use the default sender Brevo creates
# for the account (Senders -> And "from") unless you later verify a domain of your own.
notifications.brevo.api-key=${BREVO_API_KEY:}
notifications.brevo.from=${BREVO_FROM_EMAIL:}
notifications.brevo.from-name=${BREVO_FROM_NAME:DealNest}
# Resend: only usable to other recipients once you own and verify a domain on resend.com/domains.
notifications.resend.api-key=${RESEND_API_KEY:}
notifications.resend.from=${RESEND_FROM_EMAIL:}
