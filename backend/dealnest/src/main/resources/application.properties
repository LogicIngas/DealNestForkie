spring.application.name=dealnest

# MySQL Database Configuration
# Defaults to a local DB so existing solo workflows keep working untouched.
# To point at the shared team database instead, set the DB_URL / DB_USERNAME /
# DB_PASSWORD environment variables (see README) rather than editing these
# defaults - that keeps the shared credentials out of git.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dealnestdb?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Spring Boot will auto-detect the dialect, no need to hardcode it.

# Run data.sql against MySQL (not just embedded DBs), and only after Hibernate
# has created/updated the schema so the seed inserts have tables to target.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true