services:
  - type: web
    name: react-frontend
    runtime: static
    rootDir: frontend/dealnest
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://java-backend-05j0.onrender.com/api"

  - type: web
    name: java-backend
    runtime: docker
    dockerfilePath: backend/dealnest/Dockerfile
    dockerContext: backend/dealnest
    plan: free
    envVars:
      - key: DB_URL
        value: "jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require"
      - key: DB_USERNAME
        value: "postgres.qgrnvjvrcdtrxastqzfp"
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        value: "https://react-frontend-eplq.onrender.com"
      # The card checkout is a simulation and takes no money. It is switched OFF here
      # deliberately: a live instance must not accept a real card number, because
      # nothing would ever be charged and the customer would be left believing
      # otherwise. Set to "true" only on a demo deployment, never on this one.
      - key: PAYMENT_CARD_SIMULATOR_ENABLED
        value: "false"
      - key: VOUCHER_NOTIFICATIONS_ENABLED
        value: "true"
      - key: VOUCHER_EMAIL_COOLDOWN_MINUTES
        value: "60"
      - key: NOTIFICATIONS_EMAIL_PROVIDER
        value: "brevo"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: "DealNest"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
