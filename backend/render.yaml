services:
  - type: web
    name: react-frontend
    runtime: static
    rootDir: frontend/dealnest
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://java-backend.onrender.com/api"

  - type: web
    name: java-backend
    runtime: docker
    rootDir: backend/dealnest
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DB_URL
        value: "jdbc:postgresql://db.qgrnvjvrcdtrxastqzfp.supabase.co:5432/postgres?sslmode=require"
      - key: DB_USERNAME
        value: "postgres"
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        value: "https://react-frontend.onrender.com"
