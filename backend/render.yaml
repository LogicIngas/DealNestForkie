services:
  - type: web
    name: react-frontend
    runtime: static
    rootDir: frontend/dealnest
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://java-backend.onrender.com/api"

  - type: web
    name: java-backend
    runtime: docker
    dockerfilePath: backend/dealnest/Dockerfile
    dockerContext: backend/dealnest
    plan: free
    envVars:
      - key: DB_URL
        value: "jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:6543/postgres?sslmode=require"
      - key: DB_USERNAME
        value: "postgres.qgrnvjvrcdtrxastqzfp"
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        value: "https://react-frontend.onrender.com"
