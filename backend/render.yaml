services:
  - type: web
    name: react-frontend
    runtime: static
    rootDir: frontend/dealnest
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://java-backend-05j0.onrender.com/api"

  - type: web
    name: java-backend
    runtime: docker
    dockerfilePath: backend/dealnest/Dockerfile
    dockerContext: backend/dealnest
    plan: free
    envVars:
      - key: DB_URL
        value: "jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require"
      - key: DB_USERNAME
        value: "postgres.qgrnvjvrcdtrxastqzfp"
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        value: "https://react-frontend-eplq.onrender.com"
      # The card checkout validates the card that was typed in and then stands in
      # for the authorisation step a card network would perform. It takes no money
      # and cannot: no code path contacts a network, so there is no real card to
      # charge, and the number is never stored or logged.
      #
      # This is ON so the checkout can be demonstrated. It is safe to leave on for
      # that purpose, but the form is visibly labelled as simulated and the
      # activation is real — the plan does get granted. Turn this back to "false"
      # if the site is ever reachable by people who should not be able to enter a
      # card number at all.
      - key: PAYMENT_CARD_SIMULATOR_ENABLED
        value: "true"
      - key: VOUCHER_NOTIFICATIONS_ENABLED
        value: "true"
      - key: VOUCHER_EMAIL_COOLDOWN_MINUTES
        value: "60"
      - key: NOTIFICATIONS_EMAIL_PROVIDER
        value: "brevo"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: "DealNest"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

