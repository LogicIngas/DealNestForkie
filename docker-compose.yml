services:
  db:
    image: postgres:16-alpine
    container_name: dealnest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dealnestdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - dealnest-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/dealnest
      dockerfile: Dockerfile
    container_name: dealnest-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/dealnestdb
      DB_USERNAME: postgres
      DB_PASSWORD: password
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      VOUCHER_NOTIFICATIONS_ENABLED: ${VOUCHER_NOTIFICATIONS_ENABLED:-true}
      VOUCHER_EMAIL_COOLDOWN_MINUTES: ${VOUCHER_EMAIL_COOLDOWN_MINUTES:-60}
      NOTIFICATIONS_EMAIL_PROVIDER: ${NOTIFICATIONS_EMAIL_PROVIDER:-brevo}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-DealNest}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend/dealnest
      dockerfile: Dockerfile
    container_name: dealnest-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  dealnest-db-data: